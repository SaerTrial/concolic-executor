on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        llvm_versions: [14, 15]
    steps:
    - uses: actions/checkout@v4
    - run: git submodule update --init --recursive subprojects/symcc-rt hooks
    # build and test with multiple LLVM versions
    - run: docker build --build-arg LLVM_VERSION=${{ matrix.llvm_versions }} -t symqemu .
    # Every suite except qtest: the qtests boot stock QEMU machines, and the
    # concolic hooks in generic code assume the concolic-execution machine.
    # tests/symqemu needs a user-mode build, which this fork no longer has.
    - run: docker run -t symqemu make -C build check-unit check-qapi-schema check-block check-decodetree check-softfloat
    - run: docker run -t symqemu sh -c "build/qemu-system-arm -M help | grep -w concolic-execution"
